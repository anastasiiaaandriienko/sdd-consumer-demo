# Generated by DevDigest — workflow template v1, agent "security-reviewer" v1.
# The review runs the runner, manifest and skills of the PR's BASE commit, so a
# PR cannot change what it is judged by. Fork PRs are skipped (no secrets).
name: DevDigest review

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: review
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Run DevDigest review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEVDIGEST_POST_AS: pr_comment
        run: |
          if [ ! -f .devdigest/runner/index.js ]; then
            echo "::notice::DevDigest runner not found on the base branch (.devdigest/runner/index.js); skipping the review."
            exit 0
          fi
          node .devdigest/runner/index.js
      - name: Upload DevDigest result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devdigest-result
          path: devdigest-result.json
          if-no-files-found: ignore
